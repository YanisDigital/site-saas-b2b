<!doctype html>
<!-- Генератор assets/og-image.png (1200x630).
     Запуск: python scripts/og-server.py, далі відкрити
     http://127.0.0.1:8790/scripts/og-generator.html — файл перезапишеться.
     Перегенеруйте після заміни [Назва] на реальну назву. -->
<html lang="uk">
<head>
<meta charset="utf-8">
<title>OG generator</title>
<style>
  @font-face{font-family:'IBM Plex Sans';font-weight:400;src:url('/assets/fonts/ibm-plex-sans-400-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:'IBM Plex Sans';font-weight:400;src:url('/assets/fonts/ibm-plex-sans-400-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;src:url('/assets/fonts/ibm-plex-sans-600-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:'IBM Plex Sans';font-weight:600;src:url('/assets/fonts/ibm-plex-sans-600-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
  @font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('/assets/fonts/ibm-plex-mono-500-cyrillic.woff2') format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:'IBM Plex Mono';font-weight:500;src:url('/assets/fonts/ibm-plex-mono-500-latin.woff2') format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
  body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}
  canvas{max-width:96vw;box-shadow:0 8px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<canvas id="c" width="1200" height="630"></canvas>
<script>
const INK='#10131A', SOFT='#5D626D', ACCENT='#3B44F6', BG='#FBFBF9', LINE='#E4E3DE';

async function draw(){
  const probes = [
    ['600 64px "IBM Plex Sans"', 'Ви визначаєте, що важливо замість вас'],
    ['600 30px "IBM Plex Sans"', '[Назва]'],
    ['500 17px "IBM Plex Mono"', 'СИСТЕМА МОНІТОРИНГУ ПРОФЕСІЙНОЇ ІНФОРМАЦІЇ · Публічна beta'],
  ];
  await Promise.all(probes.map(([f,t]) => document.fonts.load(f, t)));
  await document.fonts.ready;

  const c = document.getElementById('c'), x = c.getContext('2d');

  // тло
  x.fillStyle = BG; x.fillRect(0,0,1200,630);

  // сітка лише у правій частині — тримає файл легким і не заважає тексту
  x.save();
  x.beginPath(); x.rect(760,0,440,630); x.clip();
  x.strokeStyle = LINE; x.lineWidth = 1;
  for(let i=760;i<=1200;i+=48){ x.beginPath(); x.moveTo(i+.5,0); x.lineTo(i+.5,630); x.stroke(); }
  for(let i=0;i<=630;i+=48){ x.beginPath(); x.moveTo(760,i+.5); x.lineTo(1200,i+.5); x.stroke(); }
  x.restore();

  // акцентна смуга зверху
  x.fillStyle = ACCENT; x.fillRect(0,0,1200,7);

  // знак + назва
  x.fillStyle = ACCENT;
  x.beginPath(); x.roundRect(72,74,30,30,8); x.fill();
  x.fillStyle = '#fff';
  [[80,82,15],[80,90,10],[80,98,13]].forEach(([bx,by,bw])=>{
    x.beginPath(); x.roundRect(bx,by,bw,3.4,1.7); x.fill();
  });
  x.fillStyle = INK; x.font = '600 30px "IBM Plex Sans"'; x.textBaseline = 'middle';
  x.fillText('[Назва]', 116, 90);

  // eyebrow
  x.font = '500 16px "IBM Plex Mono"'; x.letterSpacing = '2.6px';
  x.fillStyle = SOFT; x.textBaseline = 'alphabetic';
  x.fillText('СИСТЕМА МОНІТОРИНГУ ПРОФЕСІЙНОЇ ІНФОРМАЦІЇ', 72, 232);
  x.letterSpacing = '0px';

  // заголовок
  x.font = '600 64px "IBM Plex Sans"';
  const lh = 76, top = 316;
  x.fillStyle = INK;
  x.fillText('Ви визначаєте, що важливо.', 72, top);
  x.fillText('Система стежить за цим', 72, top + lh);
  x.fillStyle = ACCENT;
  x.fillText('замість вас.', 72, top + lh*2);

  // сигнальні бари — у порожньому правому низу, поруч із акцентним рядком
  const bars = [[168,0],[120,1],[150,0],[86,1],[134,0]];
  let by = 392;
  bars.forEach(([w,acc])=>{
    x.fillStyle = acc ? ACCENT : INK;
    x.beginPath(); x.roundRect(1128-w, by, w, 9, 4.5); x.fill();
    by += 26;
  });

  // низ
  x.strokeStyle = LINE; x.lineWidth = 1;
  x.beginPath(); x.moveTo(72,540.5); x.lineTo(1128,540.5); x.stroke();
  x.font = '500 17px "IBM Plex Mono"'; x.letterSpacing = '1px';
  x.fillStyle = SOFT; x.textBaseline = 'middle';
  x.fillText('Публічна beta — заявка на підключення', 72, 574);
  const right = 'Шум → Фільтр → Сигнал';
  x.fillStyle = ACCENT;
  x.fillText(right, 1128 - x.measureText(right).width, 574);

  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const res = await fetch('/save-og', { method:'POST', body: blob });
  document.title = 'OG: ' + (await res.text());
  window.__ogResult = document.title + ' (' + blob.size + ' bytes)';
}
draw();
</script>
</body>
</html>
